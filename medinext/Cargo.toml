[package]
name = "medinext"
version = "2.1.3"
edition = "2021"
rust-version = "1.86"

[dependencies]
aes = "0.8.4"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1.2"
md5 = "0.7"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "signal", "macros"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "socks-proxy"] }
url = "=2.5.2"

[profile.release]
strip = true
lto = "thin"
